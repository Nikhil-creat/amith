.hl{top:0}

.paused .track,.paused .fig-in,.paused .planet{animation-play-state:paused}
#fig{position:absolute;left:50%;bottom:calc(var(--h,1vh)*0 + 3vh);height:88vh;aspect-ratio:400/760;transform:translateX(-50%);perspective:900px;pointer-events:none}

<script>
const $=id=>document.getElementById(id),H=document.documentElement;
// marquee track (two identical halves → seamless loop)
const unit='<span>AMITH</span><i>G_021</i><span>ONLINE</span><i>G_005</i>';
$('trk').innerHTML=unit+unit;
// HUD bezel

if(s)p+=`V${bc-247*h}L${R-s} ${bc-195*h}V${bc+195*h}L${R} ${bc+247*h}`;
p+=`V${B-r}Q${R} ${B} ${R-r} ${B}H${cx+232*h}L${cx+190*h} ${B-37*h}H${cx-188*h}L${cx-230*h} ${B}H${L+r}Q${L} ${B} ${L} ${B-r}`;
if(s)p+=`V${bc+247*h}L${L+s} ${bc+195*h}V${bc-195*h}L${L} ${bc-247*h}`;
p+=`V${T+r}Q${L} ${T} ${L+r} ${T}Z`;$('bez').setAttribute('d',p);
const o=5*h,a=14*h;$('br').setAttribute('stroke-width',Math.max(1,2*h));
$('br').setAttribute('d',`M${o} ${o+a}V${o}H${o+a}M${W-o-a} ${o}H${W-o}V${o+a}M${o} ${Hh-o-a}V${Hh-o}H${o+a}M${W-o-a} ${Hh-o}H${W-o}V${Hh-o-a}`);
$('rl').innerHTML=ph?'':[L,R].map(x=>`<line x1="${x}" x2="${x}" y1="${bc-180*h}" y2="${bc+208*h}" stroke="#cfd6e6" stroke-width="${Math.max(.8,1.2*h)}" opacity=".55"/><circle cx="${x}" cy="${bc-180*h}" r="${3*h}" fill="#7f8aa6"/><circle cx="${x}" cy="${bc+208*h}" r="${3*h}" fill="#7f8aa6"/>`).join('')}
addEventListener('resize',bez);bez();
// motion toggle
$('mot').onclick=()=>{const p=H.classList.toggle('paused');$('ml').textContent=p?'OFF':'ON';$('mot').setAttribute('aria-pressed',p);$('mot').setAttribute('aria-label',p?'Motion off':'Motion on')};
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
// sky: procedural aurora in WebGL
const sk=$('sky'),gl=sk.getContext('webgl',{antialias:false,alpha:false});
if(gl){const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1)}',
fs=`precision mediump float;uniform vec2 R;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453)}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y)}
void main(){vec2 v=gl_FragCoord.xy/R;float y=v.y;
vec3 c=mix(vec3(.02,.03,.16),vec3(.16,.1,.42),pow(1.-y,1.6));
vec2 s=floor(gl_FragCoord.xy/2.);c+=step(.9965,h(s))*(.5+.5*sin(t*2.+h(s)*30.))*smoothstep(.35,.8,y);
for(int i=0;i<3;i++){float k=float(i);float w=y*2.4+sin(v.x*3.+t*(.35+k*.12)+k*2.)*.35+n(vec2(v.x*4.+k*5.,t*.25))*.5;
float r=exp(-pow((w-1.35-k*.28)*3.4,2.));c+=mix(vec3(.55,.2,1.),vec3(.2,.95,1.),k/2.)*r*(.55+.45*n(vec2(v.x*30.,k+t*.5)))*smoothstep(.3,.7,y)*.9;}
float cl=n(vec2(v.x*5.-t*.03,y*9.))*.6+n(vec2(v.x*11.+t*.05,y*18.))*.4;
c=mix(c,vec3(.55,.5,.85)*(.55+cl*.6),smoothstep(.36,.12,y)*(.5+cl*.5));
gl_FragColor=vec4(c,1)}`;
const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o},pr=gl.createProgram();
gl.attachShader(pr,mk(gl.VERTEX_SHADER,vs));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'t');let tm=0,last=performance.now();
const rs=()=>{const w=Math.min(1280,innerWidth);sk.width=w;sk.height=w*innerHeight/innerWidth;gl.viewport(0,0,sk.width,sk.height)};addEventListener('resize',rs);rs();
(function f(now){if(!H.classList.contains('paused')&&!rm)tm+=(now-last)/1000;last=now;gl.uniform2f(uR,sk.width,sk.height);gl.uniform1f(uT,tm);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(f)})(last)}
// cursor liquid-glass ribbed trail (2D overlay)
const tr=$('trail'),tc=tr.getContext('2d');let px=null,py,amt=0;
const rt=()=>{tr.width=innerWidth;tr.height=innerHeight};addEventListener('resize',rt);rt();
addEventListener('pointermove',e=>{$('xy').textContent='X.'+String(Math.round(e.clientX)).padStart(4,'0').slice(-4)+'  //  Y.'+String(Math.round(e.clientY)).padStart(4,'0').slice(-4);
if(!rm){if(px!==null){amt=Math.min(1,amt+Math.hypot(e.movementX,e.movementY)/40);seg(px,py,e.clientX,e.clientY)}px=e.clientX;py=e.clientY}tg(e.clientX,e.clientY)});
function seg(a,b,c,d){const L=Math.hypot(c-a,d-b)||1,nx=-(d-b)/L,ny=(c-a)/L;tc.globalCompositeOperation='lighter';
for(let i=-4;i<=4;i++){const o=i*3.2;tc.strokeStyle=`rgba(${150+i*8},${170+Math.abs(i)*8},255,${.07*(1-Math.abs(i)/5)*(.4+amt)})`;tc.lineWidth=2.4;tc.lineCap='round';tc.beginPath();tc.moveTo(a+nx*o,b+ny*o);tc.lineTo(c+nx*o,d+ny*o);tc.stroke()}

(function fd(){tc.globalCompositeOperation='destination-out';tc.fillStyle='rgba(0,0,0,.05)';tc.fillRect(0,0,tr.width,tr.height);amt*=.82;requestAnimationFrame(fd)})();

function tg(x,y){const f=$('fig').getBoundingClientRect(),hx=f.left+f.width/2,hy=f.top+f.height*.15;dx=Math.max(-1,Math.min(1,(x-hx)/(innerWidth/2)));dy=Math.max(-1,Math.min(1,(y-hy)/(innerHeight/2)))}
document.addEventListener('pointerleave',()=>{dx=dy=0});
(function fg(n){const k=1-Math.exp(-Math.min(.05,(n-lt)/1000)*4.2);lt=n;if(!H.classList.contains('paused')&&!rm){yw+=(dx*35-yw)*k;pt+=(dy*-11-pt)*k;rl+=(dx*-2.6-rl)*k;X+=(dx*14-X)*k;
fi.style.transform=`translateX(${X}px) rotateY(${yw}deg) rotateX(${pt}deg) rotateZ(${rl}deg)`}requestAnimationFrame(fg)})(lt);
// console
const AG=[['Amith-Core','Intent & persona'],['Amith-Dev','Code, git, Docker'],['Amith-Research','Web & papers'],['Amith-Sentinel','Security & cameras'],['Amith-Nexus','Smart home IoT']];
$('ags').innerHTML=AG.map(a=>`<div class="ag"><b>${a[0]}</b>${a[1]}</div>`).join('');
const ac=[...document.querySelectorAll('.ag')],lg=$('log');
const say=(t,c)=>{const p=document.createElement('p');if(c)p.className=c;p.textContent=t;lg.appendChild(p);lg.scrollTop=1e9;
if('speechSynthesis'in window&&!c&&VO){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.02;speechSynthesis.speak(u)}};
function route(q){q=q.toLowerCase();
if(/docker|git|code|bug|build|debug|script|error/.test(q))return[1,'Capturing stderr, patching the dependency and re-running. I will make up to three attempts before I trouble you, sir.'];

else{x.drawImage(v,0,0,64,48);const d=x.getImageData(0,0,64,48).data;if(prev){let s=0;for(let i=0;i<d.length;i+=16)s+=Math.abs(d[i]-prev[i]);f=s/(d.length/16)>6}prev=d}
